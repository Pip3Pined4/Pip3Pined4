<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title">
<title id="title">Runzone retro map and captured running route</title>
<defs><pattern id="mapgrid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b5d88b" stroke-opacity=".13" stroke-width="2"/></pattern></defs>
<rect width="1000" height="250" rx="12" fill="#0a1f16"/><rect width="1000" height="250" fill="url(#mapgrid)"/>
<g stroke="#33543b" stroke-width="15" fill="none" stroke-linecap="square"><path d="M30 40H300V90H510V35H760V90H970"/><path d="M90 0V250M300 90V220M510 35V210M760 90V250M0 190H300M510 210H850"/></g>
<path d="M90 190L180 190L180 125L300 125L300 90L410 90L410 155L510 155L510 210L650 210L650 145L760 145L760 90L880 90" stroke="#b5d88b" stroke-width="6" fill="none" stroke-dasharray="10 9" stroke-linecap="round">
<animate attributeName="stroke-dashoffset" values="0;-38" dur="2s" repeatCount="indefinite"/></path>
<g transform="translate(90 190)"><circle r="17" fill="#b5d88b" fill-opacity=".18"><animate attributeName="r" values="14;28;14" dur="2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".4;0;.4" dur="2s" repeatCount="indefinite"/></circle><circle r="8" fill="#f3f8e9"/></g>
<g transform="translate(880 90)"><path d="M0 -35L24 -12L0 20L-24 -12Z" fill="#f0d95c"/><circle cy="-12" r="5" fill="#0a1f16"/><animateTransform attributeName="transform" type="translate" values="880 90;880 82;880 90" dur="1.1s" repeatCount="indefinite"/></g>
<g transform="translate(600 58)"><rect x="0" y="0" width="220" height="42" rx="4" fill="#b5d88b"/><text x="12" y="27" font-family="monospace" font-size="18" font-weight="bold" fill="#0a1f16">ZONE CAPTURED +1</text><animate attributeName="opacity" values="1;1;.45;1" dur="3s" repeatCount="indefinite"/></g>
<text x="35" y="228" font-family="monospace" font-size="17" fill="#b5d88b">RUN · CAPTURE · COMPETE</text>
</svg>